services:
  postgres:
    image: postgres:16-alpine
    container_name: pz5-security-postgres
    environment:
      POSTGRES_DB: study_security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_security"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
